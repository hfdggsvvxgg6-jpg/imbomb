<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Telefone">
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <title>Discador</title>

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #2c2c2e;
      --bg-overlay: #121315;
      --bg-nav: #1c1c1e;
      --bg-input: #202227;
      --border-input: #32363e;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --text-sub: #98989d;
      --btn-active: #444446;
      --icon-fill: #a5a5a7;
      --accent-blue: #29b6f6;
      --barcode-bg: #ffffff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-main: #f2f2f7;
        --bg-card: #e5e5ea;
        --bg-overlay: #ffffff;
        --bg-nav: #e5e5ea;
        --bg-input: #f2f2f7;
        --border-input: #d1d1d6;
        --text-primary: #000000;
        --text-secondary: #8e8e93;
        --text-sub: #6c6c70;
        --btn-active: #d1d1d6;
        --icon-fill: #8e8e93;
        --accent-blue: #007aff;
        --barcode-bg: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      height: -webkit-fill-available;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      min-height: -webkit-fill-available;
      width: 100vw;
      position: fixed;
      inset: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .views-container {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .view {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      padding-top: max(env(safe-area-inset-top, 20px), 20px);
      padding-bottom: calc(85px + env(safe-area-inset-bottom, 0px));
    }

    .view.active {
      display: flex;
    }

    #view-keypad {
      justify-content: space-evenly;
      align-items: center;
      padding-top: max(env(safe-area-inset-top, 20px), 20px);
      padding-bottom: calc(85px + env(safe-area-inset-bottom, 0px));
    }

    .display-container {
      width: 100%;
      text-align: center;
      padding: 0 20px;
      min-height: 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .phone-number {
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color: var(--text-primary);
    }

    .add-contact-btn {
      color: var(--accent-blue);
      font-size: 14px;
      margin-top: 4px;
      cursor: pointer;
      display: none;
    }

    .add-contact-btn.visible {
      display: block;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 20px;
      justify-items: center;
      width: 100%;
      max-width: 320px;
    }

    .key {
      width: clamp(64px, 18vw, 82px);
      height: clamp(64px, 18vw, 82px);
      border-radius: 50%;
      background-color: var(--bg-card);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .key:active {
      background-color: var(--btn-active);
      transform: scale(0.95);
    }

    .number {
      font-size: 32px;
      font-weight: 400;
      line-height: 1;
      color: var(--text-primary);
    }

    .letters {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 2px;
      color: var(--text-secondary);
    }

    .actions-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 20px;
      width: 100%;
      max-width: 320px;
      align-items: center;
      justify-items: center;
    }

    .call-btn {
      grid-column: 2;
      width: clamp(64px, 18vw, 82px);
      height: clamp(64px, 18vw, 82px);
      border-radius: 50%;
      background-color: #34c759;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .call-btn:active {
      background-color: #28a745;
      transform: scale(0.95);
    }

    .call-btn svg {
      width: 34px;
      height: 34px;
      fill: #ffffff;
    }

    .delete-btn {
      grid-column: 3;
      color: var(--icon-fill);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
      padding: 10px;
    }

    .delete-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .delete-btn svg {
      width: 28px;
      height: 28px;
      fill: var(--icon-fill);
    }

    .placeholder-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .placeholder-screen h2 {
      color: var(--text-primary);
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .bottom-nav-container {
      position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      z-index: 1000;
    }

    .tab-bar-pill {
      display: flex;
      align-items: center;
      background-color: var(--bg-nav);
      border-radius: 40px;
      padding: 4px 6px;
      flex: 1;
      max-width: 310px;
      justify-content: space-between;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 30px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .tab-item.active {
      background-color: var(--bg-card);
      color: var(--accent-blue);
    }

    .tab-item .icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 3px;
    }

    .tab-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .tab-item.active svg {
      fill: var(--accent-blue);
    }

    .search-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: var(--bg-nav);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .search-btn:active {
      background-color: var(--bg-card);
      transform: scale(0.95);
    }

    .search-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--text-primary);
    }

    /* Modais */
    .imei-screen, .config-screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-overlay);
      display: none;
      flex-direction: column;
      z-index: 2000;
      padding: calc(env(safe-area-inset-top, 20px) + 15px) 24px calc(env(safe-area-inset-bottom, 20px) + 15px) 24px;
      overflow-y: auto;
    }

    .config-screen {
      z-index: 5000;
    }

    .imei-screen.active, .config-screen.active {
      display: flex !important;
    }

    .imei-header-actions {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 24px;
    }

    .close-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .close-icon-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--icon-fill);
    }

    .imei-screen-title, .config-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .imei-screen-subtitle, .config-subtitle {
      font-size: 14px;
      color: var(--text-sub);
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .barcode-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
      width: 100%;
    }

    .barcode-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      text-align: center;
      word-break: break-all;
    }

    .barcode-box {
      background-color: var(--barcode-bg);
      border-radius: 6px;
      padding: 10px 14px;
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 65px;
    }

    .barcode-box svg {
      width: 100%;
      height: 100%;
    }

    .share-btn-container, .save-config-btn-container {
      margin-top: auto;
      padding-top: 15px;
      width: 100%;
    }

    .share-btn, .save-config-btn {
      width: 100%;
      background-color: #2a82e4;
      color: #ffffff;
      border: none;
      border-radius: 28px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .save-config-btn {
      background-color: #34c759;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-blue);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input {
      background-color: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>

  <div class="views-container">
    <div class="view" id="view-recents">
      <div class="placeholder-screen">
        <h2>Chamadas</h2>
        <p>Histórico de chamadas recentes</p>
      </div>
    </div>

    <div class="view" id="view-contacts">
      <div class="placeholder-screen">
        <h2>Contatos</h2>
        <p>Lista de contatos</p>
      </div>
    </div>

    <div class="view active" id="view-keypad">
      <div class="display-container">
        <div class="phone-number" id="display"></div>
        <div class="add-contact-btn" id="addContact">Adicionar Número</div>
      </div>

      <div class="keypad">
        <div class="key" data-value="1"><span class="number">1</span><span class="letters">&nbsp;</span></div>
        <div class="key" data-value="2"><span class="number">2</span><span class="letters">A B C</span></div>
        <div class="key" data-value="3"><span class="number">3</span><span class="letters">D E F</span></div>
        <div class="key" data-value="4"><span class="number">4</span><span class="letters">G H I</span></div>
        <div class="key" data-value="5"><span class="number">5</span><span class="letters">J K L</span></div>
        <div class="key" data-value="6"><span class="number">6</span><span class="letters">M N O</span></div>
        <div class="key" data-value="7"><span class="number">7</span><span class="letters">P Q R S</span></div>
        <div class="key" data-value="8"><span class="number">8</span><span class="letters">T U V</span></div>
        <div class="key" data-value="9"><span class="number">9</span><span class="letters">W X Y Z</span></div>
        <div class="key" data-value="*"><span class="number">*</span><span class="letters">&nbsp;</span></div>
        <div class="key" data-value="0"><span class="number">0</span><span class="letters">+</span></div>
        <div class="key" data-value="#"><span class="number">#</span><span class="letters">&nbsp;</span></div>
      </div>

      <div class="actions-row">
        <div class="call-btn" id="callBtn">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </div>
        <div class="delete-btn" id="deleteBtn">
          <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav-container">
    <div class="tab-bar-pill">
      <div class="tab-item" data-target="view-recents">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 117 7 7.07 7.07 0 01-6-3.42l-1.42 1.42A8.93 8.93 0 0013 21a9 9 0 000-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        </div>
        <span>Recentes</span>
      </div>
      <div class="tab-item" data-target="view-contacts">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        </div>
        <span>Contatos</span>
      </div>
      <div class="tab-item active" data-target="view-keypad">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24"><path d="M12 19c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 19c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
        <span>Teclado</span>
      </div>
    </div>
    <button class="search-btn" id="configBtn">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>
  </div>

  <!-- Tela IMEI Modal -->
  <div class="imei-screen" id="imeiScreen">
    <div class="imei-header-actions">
      <div class="close-icon-btn" id="closeImei">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </div>
    </div>
    <div class="imei-screen-title">Informações do Dispositivo</div>
    <div class="imei-screen-subtitle">Identificadores do sistema</div>
    
    <div class="barcode-section">
      <div class="barcode-label">IMEI: 354829104820192</div>
      <div class="barcode-box">
        <svg viewBox="0 0 100 30"><rect width="100%" height="100%" fill="#fff"/><g fill="#000"><rect x="5" y="0" width="2" height="30"/><rect x="9" y="0" width="1" height="30"/><rect x="12" y="0" width="3" height="30"/><rect x="17" y="0" width="1" height="30"/><rect x="20" y="0" width="2" height="30"/><rect x="24" y="0" width="4" height="30"/><rect x="30" y="0" width="1" height="30"/><rect x="33" y="0" width="2" height="30"/><rect x="37" y="0" width="3" height="30"/><rect x="42" y="0" width="1" height="30"/><rect x="45" y="0" width="2" height="30"/><rect x="49" y="0" width="1" height="30"/><rect x="52" y="0" width="4" height="30"/><rect x="58" y="0" width="2" height="30"/><rect x="62" y="0" width="1" height="30"/><rect x="65" y="0" width="3" height="30"/><rect x="70" y="0" width="2" height="30"/><rect x="74" y="0" width="1" height="30"/><rect x="77" y="0" width="4" height="30"/><rect x="83" y="0" width="1" height="30"/><rect x="86" y="0" width="2" height="30"/><rect x="90" y="0" width="3" height="30"/></g></svg>
      </div>
    </div>

    <div class="share-btn-container">
      <button class="share-btn" id="closeImeiBtn">OK</button>
    </div>
  </div>

  <!-- Tela Configurações Modal -->
  <div class="config-screen" id="configScreen">
    <div class="imei-header-actions">
      <div class="close-icon-btn" id="closeConfig">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </div>
    </div>
    <div class="config-title">Configurações</div>
    <div class="config-subtitle">Ajustes da aplicação</div>

    <div class="input-group">
      <label for="inputImei">Número do IMEI</label>
      <input type="text" id="inputImei" value="354829104820192" placeholder="Digite o IMEI">
    </div>

    <div class="save-config-btn-container">
      <button class="save-config-btn" id="saveConfig">Salvar</button>
    </div>
  </div>

</body>
</html>
