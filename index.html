<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Telefone">
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <title>Discador</title>

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #2c2c2e;
      --bg-overlay: #121315;
      --bg-nav: #1c1c1e;
      --bg-input: #202227;
      --border-input: #32363e;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --text-sub: #98989d;
      --btn-active: #444446;
      --icon-fill: #a5a5a7;
      --accent-blue: #29b6f6;
      --barcode-bg: #ffffff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-main: #f2f2f7;
        --bg-card: #e5e5ea;
        --bg-overlay: #ffffff;
        --bg-nav: #e5e5ea;
        --bg-input: #f2f2f7;
        --border-input: #d1d1d6;
        --text-primary: #000000;
        --text-secondary: #8e8e93;
        --text-sub: #6c6c70;
        --btn-active: #d1d1d6;
        --icon-fill: #8e8e93;
        --accent-blue: #007aff;
        --barcode-bg: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .views-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: calc(85px + env(safe-area-inset-bottom, 0px));
    }

    .view.active {
      display: flex;
    }

    #view-keypad {
      justify-content: flex-end;
      align-items: center;
      padding-bottom: calc(85px + env(safe-area-inset-bottom, 0px));
    }

    .display-container {
      width: 100%;
      text-align: center;
      margin-bottom: 8px;
      padding: 0 20px;
      min-height: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .phone-number {
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 300;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color: var(--text-primary);
    }

    .add-contact-btn {
      color: var(--accent-blue);
      font-size: 14px;
      margin-top: 4px;
      cursor: pointer;
      display: none;
    }

    .add-contact-btn.visible {
      display: block;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2vh, 14px) clamp(12px, 4vw, 24px);
      margin-bottom: clamp(8px, 2vh, 14px);
      justify-items: center;
    }

    .key {
      width: clamp(58px, 16vw, 78px);
      height: clamp(58px, 16vw, 78px);
      border-radius: 50%;
      background-color: var(--bg-card);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .key:active {
      background-color: var(--btn-active);
      transform: scale(0.95);
    }

    .number {
      font-size: clamp(26px, 7vw, 32px);
      font-weight: 400;
      line-height: 1;
      color: var(--text-primary);
    }

    .letters {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-top: 2px;
      color: var(--text-secondary);
    }

    .actions-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(8px, 2vh, 14px) clamp(12px, 4vw, 24px);
      width: 100%;
      max-width: 320px;
      align-items: center;
      justify-items: center;
    }

    .call-btn {
      grid-column: 2;
      width: clamp(58px, 16vw, 78px);
      height: clamp(58px, 16vw, 78px);
      border-radius: 50%;
      background-color: #34c759;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .call-btn:active {
      background-color: #28a745;
      transform: scale(0.95);
    }

    .call-btn svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
    }

    .delete-btn {
      grid-column: 3;
      color: var(--icon-fill);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
      padding: 10px;
    }

    .delete-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .delete-btn svg {
      width: 28px;
      height: 28px;
      fill: var(--icon-fill);
    }

    .placeholder-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .placeholder-screen h2 {
      color: var(--text-primary);
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .bottom-nav-container {
      position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      z-index: 1000;
    }

    .tab-bar-pill {
      display: flex;
      align-items: center;
      background-color: var(--bg-nav);
      border-radius: 40px;
      padding: 4px 6px;
      flex: 1;
      max-width: 310px;
      justify-content: space-between;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      border-radius: 30px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .tab-item.active {
      background-color: var(--bg-card);
      color: var(--accent-blue);
    }

    .tab-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .imei-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-overlay);
      display: none;
      flex-direction: column;
      z-index: 2000;
      padding: calc(env(safe-area-inset-top, 20px) + 15px) 24px calc(env(safe-area-inset-bottom, 20px) + 15px) 24px;
      overflow-y: auto;
    }

    .imei-screen.active {
      display: flex;
    }

    .imei-header-actions {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 24px;
    }

    .close-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .close-icon-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--icon-fill);
    }

    .imei-screen-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="views-container">
    <div class="view" id="view-recents">
      <div class="placeholder-screen">
        <h2>Chamadas</h2>
        <p>Histórico de chamadas recentes</p>
      </div>
    </div>

    <div class="view" id="view-contacts">
      <div class="placeholder-screen">
        <h2>Contatos</h2>
        <p>Lista de contatos</p>
      </div>
    </div>

    <div class="view active" id="view-keypad">
      <div class="display-container">
        <div class="phone-number" id="display"></div>
        <div class="add-contact-btn" id="addContact">Adicionar Número</div>
      </div>

      <div class="keypad">
        <div class="key" data-value="1"><span class="number">1</span><span class="letters">&nbsp;</span></div>
        <div class="key" data-value="2"><span class="number">2</span><span class="letters">A B C</span></div>
        <div class="key" data-value="3"><span class="number">3</span><span class="letters">D E F</span></div>
        <div class="key" data-value="4"><span class="number">4</span><span class="letters">G H I</span></div>
        <div class="key" data-value="5"><span class="number">5</span><span class="letters">J K L</span></div>
        <div class="key" data-value="6"><span class="number">6</span><span class="letters">M N O</span></div>
        <div class="key" data-value="7"><span class="number">7</span><span class="letters">P Q R S</span></div>
        <div class="key" data-value="8"><span class="number">8</span><span class="letters">T U V</span></div>
        <div class="key" data-value="9"><span class="number">9</span><span class="letters">W X Y Z</span></div>
        <div class="key" data-value="*"><span class="number">*</span><span class="letters">&nbsp;</span></div>
        <div class="key" data-value="0"><span class="number">0</span><span class="letters">+</span></div>
        <div class="key" data-value="#"><span class="number">#</span><span class="letters">&nbsp;</span></div>
      </div>

      <div class="actions-row">
        <div class="call-btn" id="callBtn">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </div>
        <div class="delete-btn" id="deleteBtn">
          <svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-nav-container">
    <div class="tab-bar-pill">
      <div class="tab-item" data-tab="view-recents">
        <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        <span>Recentes</span>
      </div>
      <div class="tab-item" data-tab="view-contacts">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Contatos</span>
      </div>
      <div class="tab-item active" data-tab="view-keypad">
        <svg viewBox="0 0 24 24"><path d="M12 19c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 19c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        <span>Teclado</span>
      </div>
    </div>
  </div>

  <div class="imei-screen" id="imeiScreen">
    <div class="imei-header-actions">
      <div class="close-icon-btn" id="closeImeiBtn">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </div>
    </div>
    <div class="imei-screen-title">Informações do Dispositivo</div>
    <p style="color: var(--text-sub);">IMEI: 358941092812345</p>
  </div>

  <script>
    let currentNumber = "";
    const display = document.getElementById("display");
    const deleteBtn = document.getElementById("deleteBtn");
    const addContactBtn = document.getElementById("addContact");
    const imeiScreen = document.getElementById("imeiScreen");
    const closeImeiBtn = document.getElementById("closeImeiBtn");

    function updateDisplay() {
      display.textContent = currentNumber;
      if (currentNumber.length > 0) {
        deleteBtn.classList.add("visible");
        addContactBtn.classList.add("visible");
      } else {
        deleteBtn.classList.remove("visible");
        addContactBtn.classList.remove("visible");
      }

      if (currentNumber === "*#06#") {
        imeiScreen.classList.add("active");
      }
    }

    document.querySelectorAll(".key").forEach(key => {
      key.addEventListener("click", () => {
        currentNumber += key.getAttribute("data-value");
        updateDisplay();
      });
    });

    deleteBtn.addEventListener("click", () => {
      currentNumber = currentNumber.slice(0, -1);
      updateDisplay();
    });

    closeImeiBtn.addEventListener("click", () => {
      imeiScreen.classList.remove("active");
      currentNumber = "";
      updateDisplay();
    });

    document.querySelectorAll(".tab-item").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab-item").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
        
        tab.classList.add("active");
        const targetView = tab.getAttribute("data-tab");
        document.getElementById(targetView).classList.add("active");
      });
    });

    document.getElementById("callBtn").addEventListener("click", () => {
      if (currentNumber) {
        window.location.href = "tel:" + currentNumber;
      }
    });
  </script>
</body>
</html>
