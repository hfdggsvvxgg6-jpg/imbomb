<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Telefone">
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <title>Discador</title>

  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #2c2c2e;
      --bg-overlay: #121315;
      --bg-nav: #1c1c1e;
      --bg-input: #202227;
      --border-input: #32363e;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --text-sub: #98989d;
      --btn-active: #444446;
      --icon-fill: #a5a5a7;
      --accent-blue: #29b6f6;
      --barcode-bg: #ffffff;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-main: #f2f2f7;
        --bg-card: #e5e5ea;
        --bg-overlay: #ffffff;
        --bg-nav: #e5e5ea;
        --bg-input: #f2f2f7;
        --border-input: #d1d1d6;
        --text-primary: #000000;
        --text-secondary: #8e8e93;
        --text-sub: #6c6c70;
        --btn-active: #d1d1d6;
        --icon-fill: #8e8e93;
        --accent-blue: #007aff;
        --barcode-bg: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .views-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 40px);
      padding-bottom: 80px;
    }

    .view.active {
      display: flex;
    }

    #view-keypad {
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 125px;
    }

    .display-container {
      width: 100%;
      text-align: center;
      margin-bottom: 12px;
      padding: 0 20px;
      min-height: 52px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .phone-number {
      font-size: 36px;
      font-weight: 300;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      color: var(--text-primary);
    }

    .add-contact-btn {
      color: var(--accent-blue);
      font-size: 14px;
      margin-top: 4px;
      cursor: pointer;
      display: none;
    }

    .add-contact-btn.visible {
      display: block;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 20px;
      margin-bottom: 12px;
      justify-items: center;
    }

    .key {
      width: clamp(68px, 20vw, 92px);
      height: clamp(68px, 20vw, 92px);
      border-radius: 50%;
      background-color: var(--bg-card);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .key:active {
      background-color: var(--btn-active);
      transform: scale(0.95);
    }

    .number {
      font-size: 36px;
      font-weight: 400;
      line-height: 1;
      color: var(--text-primary);
    }

    .letters {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-top: 2px;
      color: var(--text-secondary);
    }

    .actions-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 20px;
      width: 100%;
      max-width: 320px;
      align-items: center;
      justify-items: center;
      margin-bottom: 5px;
    }

    .call-btn {
      grid-column: 2;
      width: clamp(68px, 20vw, 92px);
      height: clamp(68px, 20vw, 92px);
      border-radius: 50%;
      background-color: #34c759;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .call-btn:active {
      background-color: #28a745;
      transform: scale(0.95);
    }

    .call-btn svg {
      width: 38px;
      height: 38px;
      fill: #ffffff;
    }

    .delete-btn {
      grid-column: 3;
      color: var(--icon-fill);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
      padding: 10px;
    }

    .delete-btn.visible {
      opacity: 1;
      visibility: visible;
    }

    .delete-btn svg {
      width: 32px;
      height: 32px;
      fill: var(--icon-fill);
    }

    .placeholder-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .placeholder-screen h2 {
      color: var(--text-primary);
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .bottom-nav-container {
      position: fixed;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      z-index: 1000;
    }

    .tab-bar-pill {
      display: flex;
      align-items: center;
      background-color: var(--bg-nav);
      border-radius: 40px;
      padding: 4px 6px;
      flex: 1;
      max-width: 310px;
      justify-content: space-between;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 30px;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .tab-item.active {
      background-color: var(--bg-card);
      color: var(--accent-blue);
    }

    .tab-item .icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 3px;
    }

    .tab-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .tab-item.active svg {
      fill: var(--accent-blue);
    }

    .badge {
      position: absolute;
      top: -3px;
      right: -6px;
      background-color: #ff3b30;
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--bg-nav);
    }

    .search-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: var(--bg-nav);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .search-btn:active {
      background-color: var(--bg-card);
      transform: scale(0.95);
    }

    .search-btn svg {
      width: 22px;
      height: 22px;
      fill: var(--text-primary);
    }

    .imei-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-overlay);
      display: none;
      flex-direction: column;
      z-index: 2000;
      padding: calc(env(safe-area-inset-top, 20px) + 15px) 24px calc(env(safe-area-inset-bottom, 20px) + 15px) 24px;
      overflow-y: auto;
    }

    .imei-screen.active {
      display: flex;
    }

    .imei-header-actions {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 24px;
    }

    .close-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .close-icon-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--icon-fill);
    }

    .imei-screen-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .imei-screen-subtitle {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.35;
      margin-bottom: 28px;
    }

    .barcode-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 22px;
      width: 100%;
    }

    .barcode-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 0.2px;
      word-break: break-all;
    }

    .barcode-box {
      background-color: var(--barcode-bg);
      border-radius: 6px;
      padding: 10px 14px;
      width: 100%;
      max-width: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 65px;
    }

    .barcode-box svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .share-btn-container {
      margin-top: auto;
      padding-top: 15px;
      width: 100%;
    }

    .share-btn {
      width: 100%;
      background-color: #2a82e4;
      color: #ffffff;
      border: none;
      border-radius: 28px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s ease;
    }

    .share-btn:active {
      background-color: #1e6bc4;
    }

    /* Tela de Configuração */
    .config-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-overlay);
      display: none;
      flex-direction: column;
      z-index: 5000;
      padding: calc(env(safe-area-inset-top, 20px) + 20px) 24px calc(env(safe-area-inset-bottom, 20px) + 20px) 24px;
      overflow-y: auto;
    }

    .config-screen.active {
      display: flex !important;
    }

    .config-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .config-subtitle {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-blue);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input {
      background-color: var(--bg-input);
      border: 1px solid var(--border-input);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .save-config-btn {
      width: 100%;
      background-color: #34c759;
      color: #ffffff;
      border: none;
      border-radius: 28px;
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: auto;
      text-align: center;
      transition: background-color 0.15s ease;
    }

    .save-config-btn:active {
      background-color: #28a745;
    }
  </style>
</head>
<body>

  <div class="views-container">
    <div class="view" id="view-recents">
      <div class="placeholder-screen">
        <h2>Chamadas</h2>
        <p>Histórico de chamadas recentes</p>
      </div>
    </div>

    <div class="view" id="view-contacts">
      <div class="placeholder-screen">
        <h2>Contatos</h2>
        <p>Lista de contatos</p>
      </div>
    </div>

    <div class="view active" id="view-keypad">
      <div class="display-container">
        <div class="phone-number" id="display"></div>
        <div class="add-contact-btn" id="addContact">Adicionar Número</div>
      </div>

      <div class="keypad">
        <div class="key" data-value="1"><span class="number">1</span><span class="letters">&nbsp;</span></div>
        <div class="key" data-value="2"><span class="number">2</span><span class="letters">A B C</span></div>
        <div class="key" data-value="3"><span class="number">3</span><span class="letters">D E F</span></div>
        <div class="key" data-value="4"><span class="number">4</span><span class="letters">G H I</span></div>
        <div class="key" data-value="5"><span class="number">5</span><span class="letters">J K L</span></div>
        <div class="key" data-value="6"><span class="number">6</span><span class="letters">M N O</span></div>
        <div class="key" data-value="7"><span class="number">7</span><span class="letters">P Q
